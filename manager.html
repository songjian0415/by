<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages 图床管理</title>
<style>
:root{--mist:#CBCEB3;--sage:#999D7A;--olive:#777D48;--forest:#3A401D;--green:var(--olive);--green-dark:var(--forest);--bg:#f2f2e9;--line:#e1e2d5;--muted:#777b62;--danger:#b84b48}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(145deg,#777D48 0%,#5f6638 48%,#3A401D 100%);color:var(--forest);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(120deg,var(--forest),var(--olive));color:white;padding:30px 22px}
.header-inner,main{max-width:1100px;margin:auto}
h1{margin:0 0 5px;font-size:25px}header p{margin:0;opacity:.9}
main{padding:24px 22px 50px}
.panel{background:#CBCEB3;border:1px solid #aeb28e;border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 10px 28px #20251035}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h2{font-size:18px;margin:0}
.token-row{display:flex;gap:10px}
input[type=password],input[type=text]{width:100%;min-width:0;border:1px solid #d7e2da;border-radius:9px;padding:11px 12px;font:inherit;outline:none}
input:focus{border-color:var(--olive);box-shadow:0 0 0 3px #777d4822}
button{border:0;border-radius:10px;min-height:44px;padding:11px 17px;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation;transition:.15s}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--green);color:white}.primary:hover{background:var(--green-dark)}
.secondary{background:#999D7A;color:#202510}.danger{background:#fbefec;color:var(--danger)}
.dropzone{border:2px dashed #777D48;border-radius:16px;padding:30px 15px;text-align:center;background:#d9dac7;color:#3A401D;cursor:pointer;transition:.15s}
.dropzone.drag{border-color:var(--forest);background:#c4c8a5}
.dropzone strong{display:block;font-size:17px;margin-bottom:5px}
.muted{color:var(--muted);font-size:13px}
#fileInput{display:none}
.upload-list{display:grid;gap:10px;margin-top:14px}
.upload-item{padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.upload-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.progress{height:7px;background:#d9dac7;border-radius:20px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;width:0;background:var(--olive);transition:width .15s}
.status{font-size:12px;color:var(--muted);margin-top:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px;align-items:stretch}
.card{min-width:0;border:1px solid #aeb28e;border-radius:17px;overflow:hidden;background:#e5e6d7;box-shadow:0 5px 18px #20251020}
.preview{height:220px;background:linear-gradient(145deg,#d9dac7,#999D7A);display:flex;align-items:center;justify-content:center;padding:16px}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.preview audio{width:100%}
.file-icon{font-size:42px}
.card-body{padding:16px}
.filename{font-weight:650;overflow-wrap:anywhere;margin-bottom:8px}
.link-input{font-size:12px!important;padding:8px!important}
.card-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.card-actions button{width:100%;min-width:0;min-height:46px;padding:9px 4px;font-size:14px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:35px 10px}
.toast-wrap{position:fixed;right:18px;top:18px;z-index:10;display:grid;gap:8px}
.toast{background:var(--forest);color:white;padding:11px 15px;border-radius:12px;box-shadow:0 5px 18px #0002;max-width:min(360px,calc(100vw - 36px));animation:in .2s ease}
.toast.error{background:#a92f2f}.toast.success{background:var(--olive)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* iPad 横屏优化：设置与上传并排，图库使用更宽的多列网格 */
@media (min-width: 900px) and (orientation: landscape){
  .header-inner,main{max-width:1380px}
  main{padding:30px 30px 64px}
  .top-grid{display:grid;grid-template-columns:minmax(340px,.85fr) minmax(480px,1.35fr);gap:22px;align-items:stretch}
  .top-grid>.panel{margin-bottom:22px}
  .gallery-panel{width:100%;margin-top:2px}
  .gallery{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  .preview{height:235px}
  .dropzone{min-height:215px;display:flex;flex-direction:column;justify-content:center}
}
@media (min-width: 1180px) and (orientation: landscape){
  .gallery{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width: 900px) and (max-width: 1179px) and (orientation: landscape){
  .gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:700px){
  .token-row{flex-direction:column}
  .panel{padding:16px}
  .panel-head{align-items:flex-start}
  main{padding:18px 12px 38px}
}
@media (pointer:coarse){
  button{min-height:46px}
  .card-actions button{min-height:46px}
  input[type=password],input[type=text]{min-height:46px}
}
</style>
</head>
<body>
<header><div class="header-inner"><h1>GitHub Pages 图床管理</h1><p>轻松上传、预览、复制和管理你的图片与音频</p></div></header>
<main>
<div class="top-grid">
<section class="panel">
  <div class="panel-head"><h2>GitHub Token 设置</h2></div>
  <div class="token-row">
    <input id="tokenInput" type="password" placeholder="粘贴 GitHub Personal Access Token" autocomplete="off">
    <button class="primary" id="saveTokenBtn">保存 Token</button>
    <button class="secondary" id="clearTokenBtn">清除</button>
  </div>
  <p class="muted">Token 仅保存在当前浏览器的 localStorage。建议使用仅对该仓库开放 Contents 读写权限的 Fine-grained token。</p>
</section>

<section class="panel">
  <div class="panel-head"><h2>上传文件</h2></div>
  <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖拽文件上传">
    <strong>点击选择文件，或将文件拖拽到这里</strong>
    <span class="muted">支持从「照片」或「文件」App 多选；也可拖拽文件。支持图片与常见音频格式。</span>
    <div style="margin-top:14px"><button class="primary" type="button" id="chooseBtn">选择文件</button></div>
  </div>
  <input id="fileInput" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.svg,.bmp,.ico,.mp3,.wav,.m4a,.ogg,.flac,.aac">
  <div id="uploadList" class="upload-list"></div>
</section>
</div>

<section class="panel gallery-panel">
  <div class="panel-head">
    <h2>我的图库 <span id="fileCount" class="muted"></span></h2>
    <button class="primary" id="refreshBtn">刷新图库</button>
  </div>
  <div id="gallery" class="gallery"><div class="empty">点击“刷新图库”加载仓库文件</div></div>
</section>
</main>
<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script>
// ===== 修改这里即可切换 GitHub 用户名、仓库和分支 =====
const GITHUB_USERNAME = "songjian0415";
const REPOSITORY_NAME = "by";
const BRANCH_NAME = "main";
// =====================================================

const API_BASE = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPOSITORY_NAME}`;
const PAGES_BASE = `https://${GITHUB_USERNAME}.github.io/${REPOSITORY_NAME}`;
const TOKEN_KEY = `github_pages_token_${GITHUB_USERNAME}_${REPOSITORY_NAME}`;
const ALLOWED = new Set(["jpg","jpeg","png","gif","webp","svg","bmp","ico","mp3","wav","m4a","ogg","flac","aac"]);
const IMAGE = new Set(["jpg","jpeg","png","gif","webp","svg","bmp","ico"]);
const AUDIO = new Set(["mp3","wav","m4a","ogg","flac","aac"]);

const $ = id => document.getElementById(id);
let token = localStorage.getItem(TOKEN_KEY) || "";

function toast(message, type="success") {
  const el=document.createElement("div"); el.className=`toast ${type}`; el.textContent=message;
  $("toastWrap").appendChild(el); setTimeout(()=>el.remove(),3500);
}
function authHeaders(extra={}) {
  return {"Accept":"application/vnd.github+json","Authorization":`Bearer ${token}`,"X-GitHub-Api-Version":"2022-11-28",...extra};
}
async function api(path, options={}) {
  const response=await fetch(`${API_BASE}${path}`,{...options,headers:authHeaders(options.headers||{})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(`${data.message || "GitHub API 请求失败"} (${response.status})`);
  return data;
}
function extOf(name){return (name.split(".").pop()||"").toLowerCase()}
function safeFileName(name) {
  // 保留原文件名，仅替换 GitHub 路径中不适合的字符
  return name.trim().replace(/[\/\\?#%]/g,"_").replace(/[\u0000-\u001f]/g,"_");
}
function encodePath(path){return path.split("/").map(encodeURIComponent).join("/")}
function fileToBase64(file) {
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{const result=String(reader.result);resolve(result.slice(result.indexOf(",")+1));};
    reader.onerror=()=>reject(new Error("读取文件失败"));
    reader.readAsDataURL(file);
  });
}
function addUploadRow(name) {
  const row=document.createElement("div");row.className="upload-item";
  const top=document.createElement("div");top.className="upload-top";
  const label=document.createElement("span");label.textContent=name;
  const pct=document.createElement("span");pct.textContent="等待中";
  top.append(label,pct);
  const bar=document.createElement("div");bar.className="progress";
  const fill=document.createElement("span");bar.appendChild(fill);
  const status=document.createElement("div");status.className="status";status.textContent="准备上传";
  row.append(top,bar,status);$("uploadList").prepend(row);
  return {row,pct,fill,status};
}
async function uploadOne(file) {
  const ui=addUploadRow(file.name);
  try {
    const ext=extOf(file.name);
    if(!ALLOWED.has(ext)) throw new Error("不支持的文件格式");
    if(!token) throw new Error("请先设置并保存 GitHub Token");
    ui.status.textContent="正在读取并转换为 Base64…";
    const content=await fileToBase64(file);
    const filename=safeFileName(file.name);
    if(!filename || filename==="." || filename==="..") throw new Error("文件名无效");
    ui.fill.style.width="35%";ui.pct.textContent="35%";
    // 若同名文件已存在，先读取 SHA；GitHub 更新文件时必须附带 sha
    let existingSha = null;
    try {
      const existing = await api(`/contents/${encodePath(filename)}?ref=${encodeURIComponent(BRANCH_NAME)}`);
      if (existing && existing.type === "file") {
        const overwrite = confirm(`仓库中已存在“${filename}”。要用新文件覆盖它吗？`);
        if (!overwrite) throw new Error("已取消上传：同名文件未覆盖");
        existingSha = existing.sha;
      }
    } catch (lookupError) {
      // 404 表示这是新文件；其他错误不能忽略
      if (!String(lookupError.message).includes("(404)")) throw lookupError;
    }
    const payload = {message:`Upload ${filename}`,content,branch:BRANCH_NAME};
    if (existingSha) payload.sha = existingSha;
    await api(`/contents/${encodePath(filename)}`,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    ui.fill.style.width="100%";ui.pct.textContent="100%";
    ui.status.textContent="上传成功";
    ui.status.style.color="var(--green)";
    toast(`${filename} 上传成功`);
    await refreshGallery(false);
  } catch(err) {
    ui.pct.textContent="失败";ui.status.textContent=err.message;
    ui.status.style.color="var(--danger)";
    toast(`${file.name}：${err.message}`,"error");
  }
}
async function uploadFiles(files) {
  const list=Array.from(files||[]);
  if(!list.length)return;
  if(!token){toast("请先设置并保存 GitHub Token","error");return;}
  for(const file of list) await uploadOne(file);
}
function makeCard(file) {
  const ext=extOf(file.name),url=`${PAGES_BASE}/${file.path.split("/").map(encodeURIComponent).join("/")}`;
  const card=document.createElement("article");card.className="card";
  const preview=document.createElement("div");preview.className="preview";
  if(IMAGE.has(ext)){
    const img=document.createElement("img");img.src=url;img.alt=file.name;img.loading="lazy";
    img.onerror=()=>{preview.innerHTML="";const t=document.createElement("span");t.className="file-icon";t.textContent="🖼️";preview.appendChild(t);};
    preview.appendChild(img);
  } else if(AUDIO.has(ext)){
    const audio=document.createElement("audio");audio.controls=true;audio.preload="none";audio.src=url;preview.appendChild(audio);
  } else {const icon=document.createElement("span");icon.className="file-icon";icon.textContent="📄";preview.appendChild(icon);}
  const body=document.createElement("div");body.className="card-body";
  const name=document.createElement("div");name.className="filename";name.textContent=file.name;name.title=file.path;
  const input=document.createElement("input");input.type="text";input.readOnly=true;input.className="link-input";input.value=url;
  const actions=document.createElement("div");actions.className="card-actions";
  const copy=document.createElement("button");copy.className="secondary";copy.textContent="复制";
  copy.onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("外链已复制");}catch{input.select();document.execCommand("copy");toast("外链已复制");}};
  const open=document.createElement("button");open.className="secondary";open.textContent="打开";
  open.onclick=()=>window.open(url,"_blank","noopener");
  const del=document.createElement("button");del.className="danger";del.textContent="删除";
  del.onclick=()=>deleteFile(file);
  actions.append(copy,open,del);body.append(name,input,actions);card.append(preview,body);return card;
}
async function refreshGallery(showToast=true) {
  if(!token){toast("请先设置并保存 GitHub Token","error");return;}
  const gallery=$("gallery");gallery.innerHTML='<div class="empty">正在加载…</div>';
  try{
    // 通过 Git Trees API 递归读取整个仓库，避免只读根目录或目录列表不完整
    const branch = await api(`/branches/${encodeURIComponent(BRANCH_NAME)}`);
    const treeSha = branch.commit.commit.tree.sha;
    const treeData = await api(`/git/trees/${treeSha}?recursive=1`);
    if (treeData.truncated) throw new Error("仓库文件过多，GitHub 返回了不完整的文件列表");
    const valid = (treeData.tree || [])
      .filter(item => item.type === "blob" && ALLOWED.has(extOf(item.path)))
      .map(item => ({
        type:"file",
        path:item.path,
        name:item.path.split("/").pop(),
        sha:item.sha
      }));
    gallery.innerHTML="";
    valid.sort((a,b)=>a.path.localeCompare(b.path,"zh-CN"));
    $("fileCount").textContent=`（${valid.length} 个文件）`;
    if(!valid.length)gallery.innerHTML='<div class="empty">仓库中还没有支持格式的图片或音频文件</div>';
    else valid.forEach(file=>gallery.appendChild(makeCard(file)));
    if(showToast)toast(`图库已刷新，共 ${valid.length} 个文件`);
  }catch(err){gallery.innerHTML='<div class="empty">加载失败，请检查 Token、仓库权限和网络</div>';toast(err.message,"error");}
}
async function deleteFile(file) {
  if(!token)return toast("请先设置 Token","error");
  if(!confirm(`确定删除“${file.name}”吗？此操作会从 GitHub 仓库中删除文件。`))return;
  try{
    await api(`/contents/${encodePath(file.path)}`,{
      method:"DELETE",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:`Delete ${file.path}`,sha:file.sha,branch:BRANCH_NAME})
    });
    toast(`${file.name} 已删除`);await refreshGallery(false);
  }catch(err){toast(`删除失败：${err.message}`,"error");}
}

$("saveTokenBtn").onclick=()=>{
  const value=$("tokenInput").value.trim();
  if(!value){toast("请先输入 Token","error");return;}
  token=value;localStorage.setItem(TOKEN_KEY,token);$("tokenInput").value="";
  toast("Token 已保存在当前浏览器");refreshGallery(false);
};
$("clearTokenBtn").onclick=()=>{
  localStorage.removeItem(TOKEN_KEY);token="";$("tokenInput").value="";
  $("gallery").innerHTML='<div class="empty">Token 已清除，请重新设置后刷新图库</div>';$("fileCount").textContent="";
  toast("本地 Token 已清除");
};
$("refreshBtn").onclick=()=>refreshGallery(true);
$("chooseBtn").onclick=()=> $("fileInput").click();
$("dropzone").onclick=e=>{if(e.target.id!=="chooseBtn")$("fileInput").click();};
$("dropzone").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("fileInput").click();}};
$("fileInput").onchange=e=>{uploadFiles(e.target.files);e.target.value="";};
["dragenter","dragover"].forEach(type=>$("dropzone").addEventListener(type,e=>{e.preventDefault();$("dropzone").classList.add("drag");}));
["dragleave","drop"].forEach(type=>$("dropzone").addEventListener(type,e=>{e.preventDefault();$("dropzone").classList.remove("drag");}));
$("dropzone").addEventListener("drop",e=>uploadFiles(e.dataTransfer.files));

if(token){$("tokenInput").placeholder="已检测到本地保存的 Token（无需重新填写）";refreshGallery(false);}
</script>
</body>
</html>
